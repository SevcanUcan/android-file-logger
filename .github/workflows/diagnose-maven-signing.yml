
name: Diagnose Maven Signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-latest
    environment: maven-central
    timeout-minutes: 30

    env:
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify signing secrets exist
        shell: bash
        run: |
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKeyId"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword"

      - name: Validate GPG private key
        shell: bash
        env:
          GNUPGHOME: ${{ runner.temp }}/diagnose-gnupg
        run: |
          mkdir -m 700 -p "$GNUPGHOME"

          printf '%s\n' "$ORG_GRADLE_PROJECT_signingInMemoryKey" |
            gpg --batch --quiet --import

          if gpg --batch --list-secret-keys --with-colons 7EB5A7EC |
            grep -q '^sec:'; then
            echo "Private signing key imported successfully"
          else
            echo "::error::Expected private signing key was not found"
            exit 1
          fi

      - name: Diagnose GPG signing
        run: |
          chmod +x gradlew
          ./gradlew :filelogger-core:publishToMavenLocal --no-daemon --stacktrace
