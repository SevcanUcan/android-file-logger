name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          validate-wrappers: true
      - run: chmod +x gradlew
      - name: JVM tests
        run: ./gradlew test
      - name: API checks
        run: ./gradlew apiCheck
      - name: Wasm tests
        run: ./gradlew :filelogger-core:wasmJsNodeTest
      - name: Android lint and assemblies
        run: ./gradlew lintDebug assembleDebug assembleRelease
  ios-core:
    name: Multiplatform core and publication (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          validate-wrappers: true
      - run: chmod +x gradlew
      - run: ./gradlew :filelogger-core:compileKotlinIosArm64 :filelogger-core:compileKotlinIosSimulatorArm64
      - name: Build local publication
        id: local-publication
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -Dmaven.repo.local="$RUNNER_TEMP/filelogger-consumer-m2" publishToMavenLocal --stacktrace 2>&1 | tee publication-build.log
      - name: Report publication build failure
        if: failure() && steps.local-publication.outcome == 'failure'
        shell: bash
        run: |
          reason=$(awk '/\* What went wrong:/{getline; print; exit}' publication-build.log)
          echo "::error title=Local publication failed::${reason:-See the publication build log}"
      - name: Verify local publication
        id: local-publication-verification
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -Dmaven.repo.local="$RUNNER_TEMP/filelogger-consumer-m2" verifyMavenLocalPublications --stacktrace 2>&1 | tee publication-verification.log
      - name: Report publication verification failure
        if: failure() && steps.local-publication-verification.outcome == 'failure'
        shell: bash
        run: |
          reason=$(awk '/\* What went wrong:/{getline; print; exit}' publication-verification.log)
          echo "::error title=Local publication verification failed::${reason:-See the publication verification log}"

      - name: Verify standalone OkHttp consumer
        run: >-
          ./gradlew -Dmaven.repo.local="$RUNNER_TEMP/filelogger-consumer-m2"
          -p consumer-tests/okhttp-consumer
          :app:assembleDebug :app:assembleRelease --stacktrace

  device-tests:
    name: Device tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 24
            target: default
          - api-level: 28
            target: default
          - api-level: 33
            target: default
          - api-level: 35
            target: default
          - api-level: 36
            target: aosp_atd
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          validate-wrappers: true
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon assembleMinified assembleMinifiedAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          script: ./gradlew connectedMinifiedAndroidTest
