name: Publish Maven Central

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to verify and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-source:
    name: Verify trusted release source
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      release-sha: ${{ steps.authorize.outputs.release-sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize release tag and source commit
        id: authorize
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]

          git fetch --force --no-tags origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git fetch --force --no-tags origin \
            "+refs/tags/$RELEASE_TAG:refs/remotes/origin/release-tag-candidate"

          git merge-base --is-ancestor \
            "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"
          RELEASE_SHA="$(git rev-parse 'refs/remotes/origin/release-tag-candidate^{commit}')"
          git merge-base --is-ancestor \
            "$RELEASE_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"

          VERSION="$(git show "$RELEASE_SHA:gradle.properties" | \
            grep '^VERSION_NAME=' | cut -d= -f2)"
          test -n "$VERSION"
          test "$RELEASE_TAG" = "$VERSION"

          git checkout --detach "$RELEASE_SHA"
          test "$RELEASE_SHA" = "$(git rev-parse HEAD)"
          echo "release-sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          validate-wrappers: true

      - run: chmod +x gradlew

      - name: Test, API check, lint, and assemble
        run: ./gradlew test apiCheck :filelogger-core:wasmJsNodeTest lintDebug assembleRelease --no-daemon

  publish:
    name: Sign and publish verified source
    needs: verify-source
    runs-on: macos-latest
    environment: maven-central
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify-source.outputs.release-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck immutable release identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.verify-source.outputs.release-sha }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          test "$RELEASE_TAG" = "$VERSION"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          validate-wrappers: true

      - run: chmod +x gradlew

      - name: Validate release credentials
        shell: bash
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          test -n "$MAVEN_USERNAME"
          test -n "$MAVEN_PASSWORD"
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_KEY_ID"
          test -n "$SIGNING_PASSWORD"
          [[ "$SIGNING_KEY_ID" =~ ^(0x)?[0-9A-Fa-f]{8,40}$ ]]

      - name: Verify signed local publications
        shell: bash
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID_RAW: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNING_KEY_ID="${SIGNING_KEY_ID_RAW#0x}"
          export ORG_GRADLE_PROJECT_signingInMemoryKeyId="${SIGNING_KEY_ID: -8}"
          ./gradlew publishToMavenLocal -PverifySignatures=true --no-daemon --stacktrace
          ./gradlew verifyMavenLocalPublications -PverifySignatures=true --no-daemon

      - name: Upload deployment to Central Portal
        shell: bash
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID_RAW: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNING_KEY_ID="${SIGNING_KEY_ID_RAW#0x}"
          export ORG_GRADLE_PROJECT_signingInMemoryKeyId="${SIGNING_KEY_ID: -8}"
          ./gradlew publishToMavenCentral --no-daemon --stacktrace
